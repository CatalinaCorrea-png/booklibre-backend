spring:
  datasource:
    url: jdbc:h2:mem:booklibre_sectest;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  key: test-secret-key-test-secret-key-test-secret-key
  access-token-expiration: 900000
  refresh-token-expiration: 1800000

logging:
  level:
    root: WARN
